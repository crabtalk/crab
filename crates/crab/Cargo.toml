[package]
name = "crab-agent"
description = "Deploy and run services on the local host or Cloud"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords = ["cli", "agent", "mcp", "wasm", "crabtalk"]
categories = ["command-line-utilities"]

[[bin]]
name = "crab"
path = "bin/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
berm.workspace = true
berm-api.workspace = true
berm-build.workspace = true
berm-host.workspace = true
berm-oci.workspace = true
chrono.workspace = true
clap.workspace = true
crabtalk-sdk = { workspace = true, features = ["client"] }
futures-util.workspace = true
hex = { workspace = true, features = ["std"] }
notify.workspace = true
parking_lot.workspace = true
pulldown-cmark.workspace = true
ratatui.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
rmcp.workspace = true
rpassword.workspace = true
rusqlite.workspace = true
self_update.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
