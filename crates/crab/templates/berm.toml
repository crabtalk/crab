# The service this program deploys as.
name = "__NAME__"
# The registry repository Cloud pulls the image from, tagged with the crate's
# version on each deploy.
# image = "ghcr.io/<you>/__NAME__"
# Tools this program may make public.
public = []

# When its host calls each `#[cron]` tool: five fields, minute to day of week,
# in UTC. A tool left out is not called until its owners set one on the host.
# [crons]
# tick = "*/5 * * * *"
