# The catalog's categories, each with its platforms. A tool's `catalog` in
# `crab.toml` starts with a platform listed here; a platform is in one category.

[web]
title = "Web"
platforms = ["web", "news"]

[search]
title = "Search & SEO"
platforms = ["google", "ai-search", "bing", "duckduckgo", "yahoo", "yandex", "baidu", "naver", "seznam"]

[companies]
title = "Companies"
platforms = ["company", "crunchbase", "indeed", "remoteok", "weworkremotely"]

