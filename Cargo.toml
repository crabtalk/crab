[workspace]
members = [
    "berm/*",
    "crates/*",
    "fixtures/*",
    "services/connect/*",
    "services/agents/*",
    "services/ops/*",
    "services/web/*",
    "services/kits/*",
]
default-members = [
    "berm/*",
    "crates/*",
    "fixtures/account",
    "fixtures/bare",
    "fixtures/billing",
    "fixtures/broken",
    "fixtures/feed",
    "fixtures/fixture",
    "fixtures/keeper",
    "fixtures/kit",
    "fixtures/linked-services",
    "fixtures/openapi",
    "fixtures/site",
    "services/connect/dataforseo",
    "services/connect/firecrawl",
    "services/connect/github",
    "services/connect/litescrape",
    "services/connect/osv",
    "services/connect/posthog",
    "services/connect/resend",
    "services/connect/tinyfish",
    "services/connect/upstash",
    "services/agents/*",
    "services/ops/*",
    "services/web/*",
    "services/kits/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.4"
repository = "https://github.com/crabtalk/crab"
license = "Apache-2.0"
authors = ["clearloop <tianyi.gc@gmail.com>"]

[workspace.dependencies]
semver = "1"
crab-openapi = { path = "crates/openapi", version = "0.1.4" }
crabkit = { path = "crates/crabkit", version = "0.1.4" }
crabtalk-sdk = { path = "crates/sdk", version = "0.1.4" }

# berm
berm = { path = "berm/berm", version = "0.1.4" }
berm-abi = { path = "berm/abi", version = "0.1.4" }
berm-api = { path = "berm/api", version = "0.1.4" }
berm-build = { path = "berm/build", version = "0.1.4" }
berm-codegen = { path = "berm/codegen", version = "0.1.4" }
berm-host = { path = "berm/host", version = "0.1.4" }
berm-lang = { path = "berm/lang", version = "0.1.4" }
berm-oci = { path = "berm/oci", version = "0.1.4" }

# html
html = { package = "crab-html", path = "crates/html", version = "0.1.4" }

# fixtures
berm-kit = { path = "fixtures/kit" }

# services
github = { package = "crab-github", path = "services/connect/github", version = "0.1.4", default-features = false }
memory = { package = "crab-agent-memory", path = "services/agents/memory", version = "0.1.4", default-features = false }
osv = { package = "crab-osv", path = "services/connect/osv", version = "0.1.4", default-features = false }
posthog = { package = "crab-posthog", path = "services/connect/posthog", version = "0.1.4", default-features = false }
resend = { package = "crab-resend", path = "services/connect/resend", version = "0.1.4", default-features = false }
upstash = { package = "crab-upstash", path = "services/connect/upstash", version = "0.1.4", default-features = false }
webpage = { package = "crab-webpage", path = "services/web/markdown", version = "0.1.4", default-features = false }

# kits
auth = { package = "crabkit-auth", path = "services/kits/auth", version = "0.1.4" }
crawl = { package = "crabkit-crawl", path = "services/kits/crawl", version = "0.1.4" }
lake = { package = "crabkit-lake", path = "services/kits/lake", version = "0.1.4" }
neon = { package = "crabkit-neon", path = "services/kits/neon", version = "0.1.4" }
stripe = { package = "crabkit-stripe", path = "services/kits/stripe", version = "0.1.4" }
supabase = { package = "crabkit-supabase", path = "services/kits/supabase", version = "0.1.4" }

# crates-io
anyhow = "1.0"
axum = "0.8"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
bytesize = { version = "2.7", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
cpu-time = "1"
croner = "4"
dlmalloc = { version = "0.2", features = ["global"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
heck = "0.5"
hex = { version = "0.4", default-features = false }
htmd = "0.5.6"
humantime-serde = "1"
oas3 = { version = "0.22", default-features = false }
openapiv3 = "2.2"
object = { version = "0.40", features = ["wasm"] }
parking_lot = "0.12"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.13", default-features = false }
ring = "0.17"
rmcp = { version = "2.2", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
rusqlite = { package = "berm-rusqlite", version = "0.39", features = ["bundled", "hooks"] }
self_update = { version = "1.3", default-features = false, features = [
    "archive-tar",
    "archive-zip",
    "checksums",
    "compression-tar-xz",
    "compression-zip-deflate",
    "github",
    "progress-bar",
    "reqwest",
    "rustls",
] }
html5ever = "0.39"
lol_html = "3"
scraper = { version = "0.27", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }
serde_urlencoded = "0.7"
serde_yaml_ng = "0.10"
sha2 = "0.11"
syn = { version = "2", features = ["full"] }
tempfile = "3.27"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "net",
    "signal",
    "sync",
    "time",
] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
regex = "1"
toml = "1"
toml_edit = "0.25"
tower = { version = "0.5", features = ["util"] }
trybuild = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5"
wasmparser = "0.255"
wasmtime = { version = "48", default-features = false, features = [
    "anyhow",
    "async",
    "cache",
    "cranelift",
    "parallel-compilation",
    "pooling-allocator",
    "runtime",
    "std",
] }
url = { version = "2.5", default-features = false }
xmlparser = { version = "0.13", default-features = false }

[profile.dev]
# Enough for a backtrace to name a line. The full DWARF is what made `target`
# 12G, 8.6G of it `deps` (2026-08-27).
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
strip = "symbols"
