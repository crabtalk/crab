[workspace]
members = [
    "berm/*",
    "crates/*",
    "fixtures/*",
    "services/agents/*",
    "services/web/*",
    "services/kits/*",
    "services/hello",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.10"
repository = "https://github.com/crabtalk/crab"
license = "Apache-2.0"
authors = ["clearloop <tianyi.gc@gmail.com>"]

[workspace.dependencies]
semver = "1"
cargo_toml = "1"
crab-openapi = { path = "crates/openapi", version = "0.1.10" }
crabtalk-sdk = { path = "crates/sdk", version = "0.1.10" }

# berm
berm = { path = "berm/berm", version = "0.1.10" }
berm-abi = { path = "berm/abi", version = "0.1.10" }
berm-api = { path = "berm/api", version = "0.1.10" }
berm-build = { path = "berm/build", version = "0.1.10" }
berm-codegen = { path = "berm/codegen", version = "0.1.10" }
berm-host = { path = "berm/host", version = "0.1.10" }
berm-lang = { path = "berm/lang", version = "0.1.10" }

# html
html = { package = "crab-html", path = "crates/html", version = "0.1.10" }
sitemap = { package = "crab-sitemap", path = "crates/sitemap", version = "0.1.10" }

# fixtures
berm-kit = { path = "fixtures/kit" }

# services
cydonia-artifact = { git = "https://github.com/crabtalk/cydonia", rev = "9a79401874c9f1870c72421020aef8d76294405a", default-features = false }

# kits
auth = { package = "crabkit-auth", path = "services/kits/auth", version = "0.1.10" }
crawl = { package = "crabkit-crawl", path = "services/kits/crawl", version = "0.1.10" }
github = { package = "crabkit-github", path = "services/kits/github", version = "0.1.10" }
webpage = { package = "crabkit-webpage", path = "services/kits/webpage", version = "0.1.10" }
lake = { package = "crabkit-lake", path = "services/kits/lake", version = "0.1.10" }
neon = { package = "crabkit-neon", path = "services/kits/neon", version = "0.1.10" }
stripe = { package = "crabkit-stripe", path = "services/kits/stripe", version = "0.1.10" }
supabase = { package = "crabkit-supabase", path = "services/kits/supabase", version = "0.1.10" }

upstash = { package = "crabkit-upstash", path = "services/kits/upstash", version = "0.1.10" }

# crates-io
jsonschema = { version = "0.61", default-features = false }
anyhow = "1.0"
axum = "0.8"
http = "1"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
bytesize = { version = "2.7", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
cpu-time = "1"
croner = "4"
dlmalloc = { version = "0.2", features = ["global"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
heck = "0.5"
hex = { version = "0.4", default-features = false }
htmd = "0.5.6"
humantime = "2"
humantime-serde = "1"
oas3 = { version = "0.22", default-features = false }
openapiv3 = "2.2"
object = { version = "0.40", features = ["wasm"] }
parking_lot = "0.12"
lru = "0.18"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.13", default-features = false }
ring = "0.17"
rmcp = { version = "2.2", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
rusqlite = { package = "berm-rusqlite", version = "0.39", features = ["bundled", "hooks", "backup"] }
self_update = { version = "1.3", default-features = false, features = [
    "archive-tar",
    "archive-zip",
    "checksums",
    "compression-tar-xz",
    "compression-zip-deflate",
    "github",
    "progress-bar",
    "reqwest",
    "rustls",
] }
http-link = "1.0.1"
language-tags = "0.3.2"
html5ever = "0.39"
lol_html = "3"
scraper = { version = "0.27", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["raw_value"] }
serde_urlencoded = "0.7"
sha2 = "0.11"
syn = { version = "2", features = ["full"] }
tempfile = "3.27"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "net",
    "signal",
    "sync",
    "time",
] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
regex = "1"
toml = "1"
tower = { version = "0.5", features = ["util"] }
trybuild = "1"
wat = "1"
uuid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5"
wasmparser = "0.255"
wasm-encoder = "0.254"
wasmtime = { version = "48", default-features = false, features = [
    "anyhow",
    "async",
    "cache",
    "cranelift",
    "parallel-compilation",
    "pooling-allocator",
    "runtime",
    "std",
] }
url = { version = "2.5", default-features = false }
xmlparser = { version = "0.13", default-features = false }

[profile.dev]
# Enough for a backtrace to name a line. The full DWARF is what made `target`
# 12G, 8.6G of it `deps` (2026-08-27).
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
strip = "symbols"

# Unoptimized Cranelift made wasm-heavy tests five times slower: berm-host's
# residency and workflow_execute took 62 s, 11 s with these (2026-11-27).
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
