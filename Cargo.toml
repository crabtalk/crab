[workspace]
members = ["berm/*", "crates/*", "fixtures/*", "kits/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
repository = "https://github.com/crabtalk/crab"
license = "Apache-2.0"
authors = ["clearloop <tianyi.gc@gmail.com>"]

[workspace.dependencies]
crab = { package = "crab-agent", path = "crates/crab", version = "0.1.0" }
crabtalk-sdk = { path = "crates/sdk", version = "0.1.0" }

# berm
berm = { path = "berm/berm", version = "0.1.0" }
berm-api = { path = "berm/api", version = "0.1.0" }
berm-codegen = { path = "berm/codegen", version = "0.1.0" }
berm-host = { path = "berm/host", version = "0.1.0" }
berm-lang = { path = "berm/lang", version = "0.1.0" }
berm-oci = { path = "berm/oci", version = "0.1.0" }
bermd = { path = "berm/daemon", version = "0.1.0" }

# html
html = { package = "crab-html", path = "crates/html", version = "0.1.0" }

# fixtures
berm-kit = { path = "fixtures/kit" }

# kits
auth = { package = "crab-auth", path = "kits/auth", version = "0.1.0" }
crawl = { package = "crab-crawl", path = "kits/crawl", version = "0.1.0" }
lake = { package = "crab-lake", path = "kits/lake", version = "0.1.0" }
neon = { package = "crab-neon", path = "kits/neon", version = "0.1.0" }
stripe = { package = "crab-stripe", path = "kits/stripe", version = "0.1.0" }
supabase = { package = "crab-supabase", path = "kits/supabase", version = "0.1.0" }

# crates-io
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
bytesize = { version = "2.7", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
croner = "4"
dlmalloc = { version = "0.2", features = ["global"] }
object = { version = "0.40", features = ["wasm"] }
parking_lot = "0.12"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.13", default-features = false }
ring = "0.17"
rmcp = { version = "2.2", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
hex = "0.4"
rusqlite = { package = "berm-rusqlite", version = "0.39", features = ["bundled", "hooks"] }
rust-embed = "8"
self_update = { version = "1.3", default-features = false, features = [
    "archive-tar",
    "archive-zip",
    "checksums",
    "compression-tar-gz",
    "compression-zip-deflate",
    "github",
    "progress-bar",
    "reqwest",
    "rustls",
] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }
serde_urlencoded = "0.7"
sha2 = "0.11"
syn = { version = "2", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "net",
    "signal",
    "sync",
    "time",
] }
toml = "1"
toml_edit = "0.25"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5"
# Off by default: `cache` drags in a config format nothing here reads.
wasmtime = { version = "48", default-features = false, features = [
    "anyhow",
    "async",
    "cache",
    "cranelift",
    "parallel-compilation",
    "pooling-allocator",
    "runtime",
    "std",
] }
url = { version = "2.5", default-features = false }
xmlparser = { version = "0.13", default-features = false }

[profile.dev]
# Enough for a backtrace to name a line. The full DWARF is what made `target`
# 12G, 8.6G of it `deps` (2026-08-27).
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0
