experimental = ["setup-scripts"]
nextest-version = "0.9.98"

# Build packages separately to preserve each service's linked features.

[scripts.setup.berm-fixture]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-fixture"]

[scripts.setup.berm-bare]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-bare"]

[scripts.setup.berm-broken]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-broken"]

[scripts.setup.berm-feed]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-feed"]

[scripts.setup.berm-account]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-account"]

[scripts.setup.berm-billing]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-billing"]

[scripts.setup.berm-keeper]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-keeper"]

[scripts.setup.berm-site]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-site"]

[scripts.setup.crab-agent-memory]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-agent-memory"]

[scripts.setup.crab-uptime]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-uptime"]

[scripts.setup.crab-webhook-inbox]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-webhook-inbox"]

[scripts.setup.crab-analytics]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-analytics"]

[scripts.setup.berm-openapi]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-openapi"]

[scripts.setup.crab-resend]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-resend"]

[scripts.setup.crab-github]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-github"]

[scripts.setup.crab-upstash]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-upstash"]

[scripts.setup.crab-posthog]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-posthog"]

[scripts.setup.crab-osv]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-osv"]

[scripts.setup.berm-linked-services]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-linked-services"]

[[profile.default.scripts]]
filter = '(package(=berm-fixture) & !binary(=old) & !binary(=tools)) | (package(=berm-host) & (binary(=memory) | binary(=meters) | (binary(=records) & !test(=a_crons_last_run_outlives_its_deletion)))) | (package(=crab-agent) & (binary(=mcp) | (binary(=replay) & test(=built_replays_accept_a_new_image_but_keep_call_exit_codes))))'
setup = "berm-fixture"

[[profile.default.scripts]]
filter = 'package(=berm-bare) | (package(=berm-fixture) & binary(=set))'
setup = "berm-bare"

[[profile.default.scripts]]
filter = 'package(=berm-fixture) & binary(=set)'
setup = "berm-broken"

[[profile.default.scripts]]
filter = 'package(=berm-feed) | (package(=berm-host) & binary(=records) & test(=a_crons_last_run_outlives_its_deletion))'
setup = "berm-feed"

[[profile.default.scripts]]
filter = 'package(=berm-account)'
setup = "berm-account"

[[profile.default.scripts]]
filter = 'package(=berm-billing)'
setup = "berm-billing"

[[profile.default.scripts]]
filter = 'package(=berm-keeper)'
setup = "berm-keeper"

[[profile.default.scripts]]
filter = 'package(=berm-site)'
setup = "berm-site"

[[profile.default.scripts]]
filter = '(package(=crab-agent-memory) & binary(=runtime)) | (package(=berm-build) & binary(=services))'
setup = "crab-agent-memory"

[[profile.default.scripts]]
filter = 'package(=crab-uptime) & binary(=runtime)'
setup = "crab-uptime"

[[profile.default.scripts]]
filter = 'package(=crab-webhook-inbox) & binary(=runtime)'
setup = "crab-webhook-inbox"

[[profile.default.scripts]]
filter = 'package(=crab-analytics) & binary(=runtime)'
setup = "crab-analytics"

[[profile.default.scripts]]
filter = 'package(=crab-openapi) & binary(=wasm)'
setup = "berm-openapi"

[[profile.default.scripts]]
filter = 'package(=berm-build) & binary(=services)'
setup = "crab-resend"

[[profile.default.scripts]]
filter = 'package(=berm-build) & binary(=services)'
setup = "crab-github"

[[profile.default.scripts]]
filter = 'package(=berm-build) & binary(=services)'
setup = "crab-upstash"

[[profile.default.scripts]]
filter = 'package(=berm-build) & binary(=services)'
setup = "crab-posthog"

[[profile.default.scripts]]
filter = 'package(=berm-build) & binary(=services)'
setup = "crab-osv"

[[profile.default.scripts]]
filter = 'package(=berm-build) & binary(=services)'
setup = "berm-linked-services"
