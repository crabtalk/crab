experimental = ["setup-scripts"]
nextest-version = "0.9.98"

# Build packages separately to preserve each service's linked features.

[scripts.setup.berm-fixture]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-fixture"]

[scripts.setup.berm-bare]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-bare"]

[scripts.setup.berm-broken]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-broken"]

[scripts.setup.berm-feed]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-feed"]

[scripts.setup.berm-account]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-account"]

[scripts.setup.berm-billing]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-billing"]

[scripts.setup.berm-keeper]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-keeper"]

[scripts.setup.berm-site]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-site"]

[scripts.setup.crab-release-watch]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-release-watch"]

[scripts.setup.crab-pdl]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-pdl"]

[scripts.setup.crab-tinyfish]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-tinyfish"]

[scripts.setup.crab-companyenrich]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-companyenrich"]

[scripts.setup.crab-dataforseo]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-dataforseo"]

[scripts.setup.crab-anyapi]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-anyapi"]

[scripts.setup.crab-litescrape]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-litescrape"]

[scripts.setup.crab-contextdev]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-contextdev"]

[scripts.setup.crab-firecrawl]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-firecrawl"]

[scripts.setup.berm-tikhub]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-tikhub"]

[scripts.setup.berm-openapi]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "berm-openapi"]

[scripts.setup.crab-resend]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-resend"]

[scripts.setup.crab-github]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-github"]

[scripts.setup.crab-upstash]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-upstash"]

[scripts.setup.crab-posthog]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-posthog"]

[scripts.setup.crab-osv]
command = ["cargo", "run", "--release", "--quiet", "-p", "berm-build", "--example", "prepare", "--", "crab-osv"]

