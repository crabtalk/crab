[package]
name = "berm-billing"
description = "The reference subscriptions service, Stripe Checkout and plans through crab-stripe, what crab-stripe is tested against"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "billing"
path = "bin/main.rs"

[dependencies]
berm-lang.workspace = true
stripe.workspace = true

[dev-dependencies]
anyhow.workspace = true
berm-api.workspace = true
berm-host = { workspace = true, features = ["test"] }
serde_json = { workspace = true, features = ["std"] }
tokio.workspace = true
