[package]
name = "berm-site"
description = "The reference crawler, sites read through crabkit-crawl, what crawl's ticks are tested against"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
berm-lang.workspace = true
crawl.workspace = true
html.workspace = true
url.workspace = true

[dev-dependencies]
anyhow.workspace = true
berm-api.workspace = true
berm-host = { workspace = true, features = ["test"] }
serde_json = { workspace = true, features = ["std"] }
tokio.workspace = true
