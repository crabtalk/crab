[package]
name = "berm-lang"
description = "Guest-side library for building berm programs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["berm", "program", "sandbox", "wasm"]
categories = ["wasm", "no-std"]

[lib]
# No host tests yet: the crate is `no_std`, so a test harness would need one
# written against the stubs below.
test = false

[dependencies]
berm-codegen.workspace = true
serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, features = ["alloc"] }

# The allocator is installed as *the* global allocator, which only a guest
# target may do — off one, this crate is a library inside someone's tests and
# std already has one. It takes its heap from the host on first use.
[target.'cfg(target_arch = "wasm32")'.dependencies]
linked_list_allocator.workspace = true
