[package]
name = "berm-lang"
description = "Guest-side library for building berm services"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["berm", "service", "sandbox", "wasm"]
categories = ["wasm", "no-std"]

[lib]
# Guest behavior is covered by integration tests and consumers of `berm_lang::test`.
test = false

[dependencies]
berm-abi.workspace = true
berm-codegen.workspace = true
serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, features = ["alloc"] }

# The allocator is installed as *the* global allocator, which only a guest
# target may do — off one, this crate is a library inside someone's tests and
# std already has one. It grows the guest's memory on first use.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc.workspace = true
