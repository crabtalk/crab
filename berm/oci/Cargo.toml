[package]
name = "berm-oci"
description = "Publishing and fetching services as OCI artifacts"
edition.workspace = true
version.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
keywords = ["oci", "registry", "service", "sandbox"]
categories = ["virtualization", "wasm"]

[dependencies]
anyhow.workspace = true
berm-api.workspace = true
# TLS for the registry, the one connection here that is not loopback.
reqwest = { workspace = true, features = ["blocking", "json", "rustls"] }
serde_json = { workspace = true, features = ["std"] }
