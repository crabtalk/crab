[package]
name = "bermd"
description = "A long-running service that deploys programs and serves their tools over MCP"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords = ["mcp", "sandbox", "wasm", "program", "daemon"]
categories = ["virtualization", "wasm"]

[[bin]]
name = "bermd"
path = "bin/main.rs"

[features]
# Serves the dashboard's build, which `bun run build` in `dashboard/` writes,
# at `/`.
dashboard = ["dep:rust-embed"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
berm.workspace = true
berm-api.workspace = true
berm-host.workspace = true
clap.workspace = true
parking_lot.workspace = true
rmcp.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["rustls"] }
rust-embed = { workspace = true, optional = true, features = ["mime-guess"] }
tokio.workspace = true
toml.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
