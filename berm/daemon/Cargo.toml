[package]
name = "bermd"
description = "A long-running service that deploys programs and serves their tools over MCP"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords = ["mcp", "sandbox", "wasm", "program", "daemon"]
categories = ["virtualization", "wasm"]

[[bin]]
name = "bermd"
path = "bin/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
berm.workspace = true
berm-api.workspace = true
berm-host.workspace = true
clap.workspace = true
parking_lot.workspace = true
rmcp.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["rustls"] }
tokio.workspace = true
toml.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
base64.workspace = true
berm-host = { workspace = true, features = ["test"] }
ring.workspace = true
