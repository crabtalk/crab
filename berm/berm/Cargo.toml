[package]
name = "berm"
description = "The operating system for agent harnesses — runs guest programs under wasmtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["wasm", "sandbox", "agent", "mcp", "runtime"]
categories = ["wasm", "virtualization"]

[dependencies]
anyhow.workspace = true
berm-api.workspace = true
berm-codegen.workspace = true
futures-util.workspace = true
hex.workspace = true
libc.workspace = true
parking_lot.workspace = true
ring.workspace = true
rusqlite = { workspace = true, optional = true }
sha2.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tracing.workspace = true
wasmtime.workspace = true
tokio = { workspace = true, optional = true }

[features]
# `database`: a program's own SQLite database, for a host serving `berm.sql`.
sqlite = ["dep:rusqlite", "dep:tokio"]

[dev-dependencies]
rusqlite.workspace = true
tokio.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[test]]
name = "migrations"
required-features = ["sqlite"]

[[test]]
name = "size"
required-features = ["sqlite"]
