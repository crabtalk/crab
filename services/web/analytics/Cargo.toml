[package]
name = "crab-analytics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Website funnels and channel attribution for Stripe revenue"
readme = "README.md"

[lib]
name = "analytics"
crate-type = ["cdylib", "rlib"]

[features]
default = ["tools"]
tools = []

[dependencies]
berm-lang.workspace = true
hex = { workspace = true, features = ["alloc"] }
sha2.workspace = true
url.workspace = true

[dev-dependencies]
anyhow.workspace = true
berm.workspace = true
berm-api.workspace = true
berm-build.workspace = true
berm-host = { workspace = true, features = ["test"] }
rusqlite.workspace = true
serde_json.workspace = true
tokio.workspace = true
