[package]
name = "crab-firecrawl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bounded Firecrawl search, extraction, mapping and crawl tools"
readme = "README.md"

[lib]
name = "firecrawl"
crate-type = ["cdylib", "rlib"]

[features]
default = ["tools"]
tools = []

[dependencies]
berm-lang.workspace = true
crab-openapi.workspace = true
url.workspace = true

[build-dependencies]
berm-build.workspace = true
serde_json = { workspace = true, features = ["std"] }
