name = "firecrawl"
logo = "https://crab.talk/logos/templates/firecrawl-v1.png"
template = true
buffer = 8388608

[syscalls]
"berm.http.fetch" = ["api.firecrawl.dev"]

[credentials.firecrawl]
title = "Firecrawl API key"
guide = "Create an API key at https://firecrawl.dev. Scraped pages and search results consume your Firecrawl credits."
hosts = ["api.firecrawl.dev"]
secrets = [{ name = "FIRECRAWL_API_KEY", label = "API key" }]

[tools.scrape]
access = "public"
title = "Scrape a page"
catalog = "web.extract"

[tools.search]
access = "public"
title = "Search the web"
catalog = "web.search"

[tools.map]
access = "public"
title = "Map a website"
catalog = "web.map"

[tools.crawl]
access = "public"
title = "Start a website crawl"
catalog = "web.crawl"

[tools.crawl_status]
access = "public"
title = "Check a website crawl"
catalog = "web.crawl.status"

[tools.batch_scrape]
access = "public"
title = "Extract a batch of pages"
catalog = "web.extract.batch"

[tools.batch_scrape_status]
access = "public"
title = "Check a batch scrape"
catalog = "web.extract.batch.status"
