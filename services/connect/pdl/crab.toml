name = "pdl"
template = true
buffer = 8388608

[syscalls]
"berm.http.fetch" = ["api.peopledatalabs.com"]

[credentials.pdl]
title = "People Data Labs API key"
guide = "Create an API key at https://dashboard.peopledatalabs.com. Enrichment consumes credits per match; search consumes credits per returned record."
hosts = ["api.peopledatalabs.com"]
secrets = [{ name = "PDL_API_KEY", label = "API key" }]

[tools.enrich_person]
access = "public"
title = "Enrich a person"
catalog = "person.enrich"

[tools.search_people]
access = "public"
title = "Search people"
catalog = "person.search"

[tools.enrich_company]
access = "public"
title = "Enrich a company"
catalog = "company.enrich"

[tools.search_companies]
access = "public"
title = "Search companies"
catalog = "company.search"
