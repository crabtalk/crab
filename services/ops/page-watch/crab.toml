image = "ops/page-watch"
public = false
template = false
buffer = 1048576

[database]
size = "16MiB"

[tools.read]
budget = { cpu = 60000, read = 1, written = 1, memory = 64 }

[tools.compare]
budget = { cpu = 100000, read = 500000, written = 1, memory = 64 }

[tools.save]
budget = { cpu = 100000, read = 1, written = 500000, memory = 64 }

[workflows.page_watch]
access = "public"
title = "Check page changes"
price = 1000
max_cost = 100000
checkpoint_bytes = 8388608
retain = "7d"
budget = { cpu = 100000, read = 0, written = 0, memory = 64 }

