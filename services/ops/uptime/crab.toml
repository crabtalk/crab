name = "uptime"
id = "fcdebd754bbf495a8d4ca14af5d76ecf"
public = false
template = true
buffer = 262144

[database]
migrations = "migrations"
size = "64MiB"

[syscalls]
"berm.http.fetch" = ["*"]

[crons]
tick = "* * * * *"

[tools.tick]
budget = { cpu = 100000, read = 200000, written = 25000, memory = 16 }

[tools.watch]
access = "public"
title = "Watch URL"
budget = { cpu = 100000, read = 20000, written = 5000, memory = 16 }

[tools.unwatch]
access = "public"
title = "Remove monitor"
budget = { cpu = 100000, read = 20000, written = 5000, memory = 16 }

[tools.monitors]
access = "public"
title = "List monitors"
budget = { cpu = 100000, read = 20000, written = 5000, memory = 16 }

[tools.check]
access = "public"
title = "Check now"
budget = { cpu = 100000, read = 20000, written = 5000, memory = 16 }

[tools.history]
access = "public"
title = "Read uptime history"
budget = { cpu = 100000, read = 20000, written = 5000, memory = 16 }

[tools.status]
access = "anonymous"
title = "Service status"
budget = { cpu = 100000, read = 20000, written = 5000, memory = 16 }
