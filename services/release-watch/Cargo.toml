[package]
name = "crab-release-watch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Retained GitHub release and OSV advisory observations"
readme = "README.md"

[lib]
name = "release_watch"
crate-type = ["cdylib", "rlib"]

[features]
default = ["tools"]
tools = []

[dependencies]
berm-lang.workspace = true
github.workspace = true
osv = { package = "crab-osv", path = "../osv", default-features = false }

[dev-dependencies]
anyhow.workspace = true
berm-api.workspace = true
berm-host = { workspace = true, features = ["test"] }
serde_json.workspace = true
tokio.workspace = true
