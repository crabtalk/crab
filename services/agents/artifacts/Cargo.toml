[package]
name = "crab-agent-artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared articles and boards in each calling account's storage"
publish = false

[lib]
name = "agent_artifacts"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
berm-lang = { workspace = true, features = ["std"] }
cydonia-artifact.workspace = true
hex = { workspace = true, features = ["alloc"] }

[dev-dependencies]
berm-api.workspace = true
berm-build.workspace = true
berm-host = { workspace = true, features = ["test"] }
rusqlite.workspace = true
tokio.workspace = true
