name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check changelog contains the current version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "crab-agent") | .version')
          if ! .github/scripts/release-notes "$version" > /dev/null; then
            echo "::error file=changelog.json::Add a changelog entry for crab-agent $version before merging."
            exit 1
          fi

  test:
    env:
      RUSTFLAGS: -D warnings
    name: test (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Tests under `berm_host::test` build guest images.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --release

  lint:
    env:
      RUSTFLAGS: -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy
