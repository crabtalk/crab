# The service this program deploys as. An app lists it as an issuer under this
# name's issuer URL.
name = "auth"
# The registry repository Cloud pulls the image from, tagged with the crate's
# version on each deploy.
# image = "ghcr.io/<you>/auth"
# Tools this program may make public.
public = ["github", "google", "link_github", "link_google", "account"]
