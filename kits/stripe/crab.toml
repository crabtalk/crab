# What its applied migrations are kept under in a database; never changes.
id = "ae651d8d51157671ad3e1299f0654a9d"

[syscalls]
"berm.http.fetch" = ["api.stripe.com"]

[database]
migrations = "migrations"

[credentials.stripe]
title = "Stripe restricted key"
guide = """
The service uses this key to make Checkout and customer portal sessions for its users, create their Stripe customers, and read their subscriptions and the prices they choose. Whoever holds it can act on the Stripe account within its permissions, so give it only these.

At https://dashboard.stripe.com/apikeys, create a restricted key with Write on Checkout Sessions, Customer portal and Customers, Read on Subscriptions and Prices, and None on everything else. Make it in test mode for development and in live mode for production: a test key starts with `rk_test_` and moves no money, a live key starts with `rk_live_` and charges real cards.
"""
secrets = [
    { name = "STRIPE_SECRET_KEY", label = "Restricted key", pattern = '^rk_(test|live)_' },
]
