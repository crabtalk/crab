[package]
name = "crab-stripe"
version.workspace = true
description = "Stripe subscriptions for a product's users: Checkout, the customer portal, and each user's plan."
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["stripe", "subscriptions", "berm", "wasm", "crabtalk"]
categories = ["wasm", "web-programming"]

[[bin]]
name = "stripe"
path = "bin/main.rs"

[dependencies]
berm-lang.workspace = true

[dev-dependencies]
anyhow.workspace = true
berm-api.workspace = true
berm-host = { workspace = true, features = ["test"] }
serde_json = { workspace = true, features = ["std"] }
tokio.workspace = true
